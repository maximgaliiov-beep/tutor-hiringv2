"funnel_order": [
"applied",
"evaluation",
"offer_accepted",
"practice_completed",
"hired"
],
"labels": {
"applied": "Applied",
"evaluation": "Interview Completed (Evaluation)",
"offer_accepted": "Offer Accepted",
"practice_completed": "Practice Completed",
"hired": "Active Tutor (Hired)"
}
};
const STAGES = ["applied","evaluation","offer_accepted","practice_completed","hired"];
const LABELS = ["Applied","Interview","Offer","Practice","Hired"];
const pct = (a,b) => b?((a/b)*100).toFixed(1)+'%':'0%';
const pctN = (a,b) => b?((a/b)*100):0;

// Colors
const FUNNEL_COLORS = ['#3498db','#2ecc71','#e67e22','#9b59b6','#e74c3c'];
const DIR_COLORS = {Math:'#3498db',ELA:'#2ecc71',Demo:'#e67e22'};
const SRC_COLORS = {Facebook:'#4267B2','Non-Facebook':'#2ecc71'};

const darkOpts = {
  responsive:true,
  plugins:{legend:{labels:{color:'#ccc'}}},
  scales:{
    x:{ticks:{color:'#aaa'},grid:{color:'#333'}},
    y:{ticks:{color:'#aaa'},grid:{color:'#333'}}
  }
};

// 1. Combined Funnel
const td = D.total;
new Chart(document.getElementById('funnelChart'),{
  type:'bar',
  data:{
    labels:LABELS.map((l,i)=>l+' ('+pct(td[STAGES[i]],td.applied)+')'),
    datasets:[{
      label:'Candidates',
      data:STAGES.map(s=>td[s]),
      backgroundColor:FUNNEL_COLORS,
      borderRadius:6
    }]
  },
  options:{...darkOpts,indexAxis:'y',plugins:{...darkOpts.plugins,title:{display:true,text:'All-Time Funnel: '+td.applied.toLocaleString()+' Applied → '+td.hired.toLocaleString()+' Hired',color:'#fff',font:{size:14}}}}
});

// 2. Direction charts
function dirChart(id,name,color){
  const d=D.byDir[name];
  new Chart(document.getElementById(id),{
    type:'bar',
    data:{
      labels:LABELS,
      datasets:[{label:name,data:STAGES.map(s=>d[s]),backgroundColor:color+'99',borderColor:color,borderWidth:2,borderRadius:6}]
    },
    options:{...darkOpts,plugins:{...darkOpts.plugins,title:{display:true,text:name+': '+d.applied.toLocaleString()+' → '+d.hired.toLocaleString()+' ('+pct(d.hired,d.applied)+')',color:'#fff',font:{size:13}}}}
  });
}
dirChart('mathChart','Math','#3498db');
dirChart('elaChart','ELA','#2ecc71');
dirChart('demoChart','Demo','#e67e22');

// 3. Source comparison
new Chart(document.getElementById('sourceChart'),{
  type:'bar',
  data:{
    labels:LABELS,
    datasets:['Facebook','Non-Facebook'].map(src=>{
      const d=D.bySrc[src];
      return {label:src,data:STAGES.map(s=>d[s]),backgroundColor:SRC_COLORS[src]+'99',borderColor:SRC_COLORS[src],borderWidth:2,borderRadius:6};
    })
  },
  options:darkOpts
});

// 4. Conversion rates table
(function(){
  const t=document.getElementById('convTable');
  const groups = [
    ['Math',D.byDir.Math],['ELA',D.byDir.ELA],['Demo',D.byDir.Demo],
    ['Facebook',D.bySrc.Facebook],['Non-FB',D.bySrc['Non-Facebook']],['Total',D.total]
  ];
  const convs = [
    ['App→Interview','applied','evaluation'],
    ['Interview→Offer','evaluation','offer_accepted'],
    ['Offer→Practice','offer_accepted','practice_completed'],
    ['Practice→Hired','practice_completed','hired'],
    ['App→Hired','applied','hired']
  ];
  let h='<tr><th>Conversion</th>';
  groups.forEach(g=>h+='<th>'+g[0]+'</th>');
  h+='</tr>';
  convs.forEach(([label,from,to])=>{
    h+='<tr><td style="text-align:left;font-weight:600">'+label+'</td>';
    groups.forEach(([,d])=>{
      const v=pctN(d[to],d[from]);
      const cls=v>=10?'good':v>=3?'mid':'low';
      h+='<td class="'+cls+'">'+v.toFixed(1)+'%</td>';
    });
    h+='</tr>';
  });
  t.innerHTML=h;
})();

// 5. Cohort table
(function(){
  const t=document.getElementById('cohortTable');
  let h='<tr><th>Cohort</th>';
  LABELS.forEach(l=>h+='<th>'+l+'</th>');
  h+='<th>App→Int%</th><th>App→Hired%</th></tr>';
  D.cohMonths.forEach(m=>{
    const d=D.cohTot[m];
    const intPct=pctN(d.evaluation,d.applied);
    const hirePct=pctN(d.hired,d.applied);
    h+='<tr><td style="font-weight:600">'+m+'</td>';
    STAGES.forEach(s=>h+='<td>'+d[s].toLocaleString()+'</td>');
    // heatmap color
    const intBg='rgba(46,204,113,'+(Math.min(intPct/15,1)*0.6+0.1)+')';
    const hireBg='rgba(231,76,60,'+(Math.min(hirePct/3,1)*0.6+0.1)+')';
    h+='<td style="background:'+intBg+';font-weight:700">'+intPct.toFixed(1)+'%</td>';
    h+='<td style="background:'+hireBg+';font-weight:700">'+hirePct.toFixed(1)+'%</td></tr>';
  });
  t.innerHTML=h;
})();

// 6. Cohort trends
(function(){
  const months=D.cohMonths;
  const mkLine=(label,color,dash,getData)=>({
    label,borderColor:color,backgroundColor:color+'33',
    data:months.map(m=>getData(m)),
    borderDash:dash,tension:0.3,pointRadius:5,pointBackgroundColor:color
  });
  const fbD=m=>D.cohSrc[m].Facebook, nfD=m=>D.cohSrc[m]['Non-Facebook'];
  new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{
      labels:months,
      datasets:[
        mkLine('FB App→Int%','#4267B2',[],m=>pctN(fbD(m).evaluation,fbD(m).applied)),
        mkLine('Non-FB App→Int%','#2ecc71',[],m=>pctN(nfD(m).evaluation,nfD(m).applied)),
        mkLine('FB App→Hired%','#4267B2',[5,5],m=>pctN(fbD(m).hired,fbD(m).applied)),
        mkLine('Non-FB App→Hired%','#2ecc71',[5,5],m=>pctN(nfD(m).hired,nfD(m).applied)),
      ]
    },
    options:{...darkOpts,plugins:{...darkOpts.plugins,title:{display:true,text:'Conversion Trends by Source (Dashed = App→Hired)',color:'#fff',font:{size:14}}}}
  });
})();
